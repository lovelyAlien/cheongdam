spring.application.name=cheongdam
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cheongdam}
spring.datasource.username=${DB_USER:cheongdam}
spring.datasource.password=${DB_PASSWORD:cheongdam}
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
# JavaMail 상태 검사는 health를 부를 때마다 SMTP에 접속한다. 계정이 없으면 서비스 전체가 DOWN이 되고,
# 계정이 있어도 메일 서버에 매번 로그인해 Gmail이 수상한 접속으로 막을 수 있다. 발송 실패는 alert_outbox가 따로 기록한다
management.health.mail.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE
# 스키마는 Flyway가 소유한다. Hibernate는 엔티티와 스키마가 어긋나는지만 검증한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 메일 속 링크의 기준 주소
app.base-url=${APP_BASE_URL:https://cheongdam.app}

# 메일 발송기: smtp(실제 발송) / log(로그만 찍음) / none(미설정, 기본값)
app.mail.provider=${APP_MAIL_PROVIDER:none}
# 발신 주소. 비워 두면 spring.mail.username을 쓴다
app.mail.from=${APP_MAIL_FROM:}
# 발신자 이름(app.mail.from-name)은 여기 두지 않는다. .properties는 ISO-8859-1로 읽혀 한글이 깨진다.
# 기본값 "청담"은 SmtpAlertMailer의 @Value에 있고, 바꾸려면 APP_MAIL_FROM_NAME 환경 변수를 쓴다

# SMTP. 개발 중에는 Gmail(2단계 인증 + 앱 비밀번호)을 쓴다. 비밀번호는 환경 변수로만 넘긴다
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# 기본값이 무한 대기라 반드시 건다. 발송은 행 잠금을 쥔 트랜잭션 안에서 일어난다
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
