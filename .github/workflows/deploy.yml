name: Deploy

# v로 시작하는 태그(v1.2.0 등)를 push하면 CI를 통과한 뒤 운영 서버(runvas)에 배포한다.
on:
  push:
    tags: ['v*']

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다(중간에 끊기면 서버가 어중간해진다).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # 서버는 메모리·디스크가 작아 빌드하지 않는다. 러너(amd64)에서 이미지를 만들어 올린다.
      - name: 이미지 빌드
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
        run: |
          docker build -t cheongdam-backend:prod backend
          docker build -t cheongdam-batch:prod batch
          docker build -t cheongdam-web:prod --build-arg VITE_KAKAO_JS_KEY="$VITE_KAKAO_JS_KEY" frontend

      - name: SSH 설정
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' "$SSH_HOST" > ~/.ssh/config

      - name: 이미지 전송
        run: docker save cheongdam-backend:prod cheongdam-batch:prod cheongdam-web:prod | gzip | ssh prod 'gunzip | docker load'

      - name: 컨테이너 교체
        run: |
          ssh prod 'cd /root/cheongdam-prod && docker compose -p cheongdam up -d && docker image prune -f'

      # 백엔드가 뜰 때까지 기다린다. 웹(127.0.0.1:8000)을 거쳐 API까지 응답하는지 본다.
      - name: 헬스 체크
        run: |
          for i in $(seq 1 30); do
            if ssh prod 'curl -fsS -o /dev/null http://127.0.0.1:8000/api/notices'; then echo "배포 성공: $GITHUB_REF_NAME"; exit 0; fi
            sleep 5
          done
          ssh prod 'cd /root/cheongdam-prod && docker compose -p cheongdam ps && docker compose -p cheongdam logs --tail 50 backend'
          exit 1
