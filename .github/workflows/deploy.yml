name: Deploy

# v로 시작하는 태그(v1.2.0 등)를 push하면 CI를 통과한 뒤 운영 서버(runvas)에 배포한다.
on:
  push:
    tags: ['v*']

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다(중간에 끊기면 서버가 어중간해진다).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # 서버는 메모리·디스크가 작아 빌드하지 않는다. 러너(amd64)에서 이미지를 만들어 올린다.
      - name: 이미지 빌드
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
        run: |
          docker build -t cheongdam-backend:prod backend
          docker build -t cheongdam-batch:prod batch
          docker build -t cheongdam-web:prod --build-arg VITE_KAKAO_JS_KEY="$VITE_KAKAO_JS_KEY" frontend

      - name: SSH 설정
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' "$SSH_HOST" > ~/.ssh/config

      # 서버 디스크가 작다. 이미지를 받기 전에 안 쓰는 이미지·빌드 캐시·오래된 로그를 지운다.
      # 컨테이너(실행 중이든 멈춰 있든)가 쓰는 이미지는 prune 대상이 아니다.
      - name: 서버 정리
        run: ssh prod 'docker image prune -af; docker builder prune -af; journalctl --vacuum-size=200M; df -h /'

      # 새 이미지는 바뀐 층만 늘어나지만, 받다가 공간이 모자라면 서버가 어중간해지니 미리 멈춘다.
      - name: 디스크 여유 확인
        run: |
          avail=$(ssh prod "df --output=avail -m / | tail -1")
          echo "남은 공간: ${avail}MB"
          [ "$avail" -ge 500 ] || { echo "::error::디스크 여유가 500MB 미만이라 배포를 멈춘다"; exit 1; }

      # 운영 .env는 PROD_ENV 시크릿이 원본이다. 필수 키가 빠졌거나 DB_PASSWORD가 바뀌면
      # (DB는 처음 비밀번호를 계속 쓴다) 서버를 건드리기 전에 멈춘다. 기존 파일은 .env.bak으로 남긴다.
      - name: 운영 .env 반영
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          for k in DB_PASSWORD APP_BASE_URL DATA_GO_KR_KEY KAKAO_REST_KEY; do
            printf '%s\n' "$PROD_ENV" | grep -q "^$k=." || { echo "::error::PROD_ENV에 $k가 없다"; exit 1; }
          done
          new=$(printf '%s\n' "$PROD_ENV" | grep '^DB_PASSWORD=' | cut -d= -f2- | sha256sum)
          old=$(ssh prod "grep '^DB_PASSWORD=' /root/cheongdam-prod/.env | cut -d= -f2- | sha256sum")
          [ "$new" = "$old" ] || { echo "::error::DB_PASSWORD가 서버 값과 다르다. DB 접속이 끊기므로 멈춘다"; exit 1; }
          printf '%s\n' "$PROD_ENV" | ssh prod 'cd /root/cheongdam-prod && umask 077 && cat > .env.new && cp -p .env .env.bak && mv .env.new .env'

      # 이미지를 받는 동안 메모리를 조금이라도 비운다. 다음 단계의 compose up이 다시 띄운다.
      - name: 배치 잠시 중지
        run: ssh prod 'cd /root/cheongdam-prod && docker compose -p cheongdam stop batch'

      - name: 이미지 전송
        run: docker save cheongdam-backend:prod cheongdam-batch:prod cheongdam-web:prod | gzip | ssh prod 'gunzip | docker load'

      - name: 컨테이너 교체
        run: |
          ssh prod 'cd /root/cheongdam-prod && docker compose -p cheongdam up -d && docker image prune -f'

      # 백엔드가 뜰 때까지 기다린다. 웹(127.0.0.1:8000)을 거쳐 API까지 응답하는지 본다.
      - name: 헬스 체크
        run: |
          for i in $(seq 1 30); do
            if ssh prod 'curl -fsS -o /dev/null http://127.0.0.1:8000/api/notices'; then echo "배포 성공: $GITHUB_REF_NAME"; exit 0; fi
            sleep 5
          done
          ssh prod 'cd /root/cheongdam-prod && docker compose -p cheongdam ps && docker compose -p cheongdam logs --tail 50 backend'
          exit 1
