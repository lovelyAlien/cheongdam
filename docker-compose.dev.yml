# 로컬 개발용 덧씌우기. 배포 서버에서는 쓰지 않는다(docker-compose.yml만 사용).
# 사용법: ./dev.sh up   (README의 "로컬 실행" 참고)
services:
  db:
    ports:
      - "127.0.0.1:55432:5432"   # 로컬 DB 도구·Python 배치 개발용. 내 컴퓨터에서만 접속된다

  backend:
    environment:
      # 시작할 때마다 DEV로 시작하는 샘플 공고를 지우고 다시 넣는다. 운영 DB에서는 절대 켜지 않는다.
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "127.0.0.1:8080:8080"    # API를 curl로 바로 확인

  batch:
    profiles: ["batch"]          # 기본 ./dev.sh up에서는 띄우지 않는다. 인증키가 있을 때: ./dev.sh batch
    environment:
      DB_PASSWORD: dev
