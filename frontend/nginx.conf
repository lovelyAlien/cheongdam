# 구독 메일 링크의 token은 권한이라 액세스 로그에 남기지 않는다(API.md 5장)
map $request $log_request {
    ~^(?<head>.*[?&]token=)[^&\s]+(?<tail>.*)$  "${head}***${tail}";
    default                                      $request;
}
map $http_referer $log_referer {
    ~^(?<head>.*[?&]token=)[^&\s]+(?<tail>.*)$  "${head}***${tail}";
    default                                      $http_referer;
}
log_format masked '$remote_addr - [$time_local] "$log_request" $status $body_bytes_sent "$log_referer"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log masked;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
